<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AI 2D Studio · Spline 制作台预览</title>
  <link rel="stylesheet" href="studio.css">
  <script src="studio.js" defer></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-library" aria-hidden="true">
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2 7M3 5v6h6M12 7v5l3 2"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4M18 4h4"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></symbol>
    <symbol id="i-landscape" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m3 16 6-6 5 5 3-3 4 4"/><circle cx="16" cy="8" r="1"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h7l2 3h9v12H3Z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5ZM14 3v6h5M8 13h8M8 17h6"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8Zm-9 5 9 5 9-5M12 13v9M8 5l9 5"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 7M20 5v6h-6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  </svg>
  <div class="preview-strip">
    <span><strong>3-0 · 设计预览</strong><span class="strip-note">仅演示交互，不连接 AI</span></span>
    <div class="preview-options">
      <label for="preview-state">查看状态</label>
      <select id="preview-state"><option value="ready">待确认</option><option value="running">制作中</option><option value="failed">修改失败</option><option value="first">第一次使用</option></select>
      <a href="https://styles.refero.design/style/b36d5c7c-9b28-4c99-b5a8-69ce03621410" target="_blank" rel="noreferrer">Spline 参考 ↗</a>
    </div>
  </div>
  <header class="app-header">
    <button class="brand" data-home aria-label="查看首次使用页面"><span class="brand-mark" aria-hidden="true"></span><span>AI 2D <span class="brand-light">Studio</span></span></button>
    <div class="project-title"><span>我的游戏</span><span class="separator">/</span><strong>竹林剑客</strong><span class="local-label">本地项目</span></div>
    <div class="header-actions"><button class="quiet-button" data-history aria-label="版本记录" title="版本记录"><svg class="icon"><use href="#i-history"/></svg><span>版本记录</span></button><button class="account-button" data-account aria-label="账户与环境" title="账户与环境">我</button></div>
  </header>
  <nav id="steps" class="progress-nav" aria-label="制作步骤"></nav>
  <main id="workspace"></main>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-header"><h2 id="dialog-title"></h2><button class="icon-button" data-close aria-label="关闭弹窗"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="dialog-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
