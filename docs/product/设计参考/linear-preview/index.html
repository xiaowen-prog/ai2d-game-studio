<style>
:root{--void:#08090a;--carbon:#0f1011;--obsidian:#161718;--line:#23252a;--smoke:#383b3f;--fog:#8a8f98;--mist:#d0d6e0;--white:#fff;--lime:#e4f222;--error:#eb5757;--font:'Inter Variable',Inter,system-ui,-apple-system,'PingFang SC','Hiragino Sans GB',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--void);color:var(--mist);font:400 15px/1.6 var(--font);font-feature-settings:'cv01' on,'ss03' on,'zero' on;letter-spacing:-.011em}button,input,textarea,select{font:inherit;color:inherit}button,a,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:var(--mist);text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--mist);outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:32px;font-weight:510;line-height:1.25;letter-spacing:-.012em;color:var(--white)}h2{font-size:20px;font-weight:510;color:var(--white)}h3{font-size:15px;font-weight:510;color:var(--white)}small{font-size:12px}button svg,a svg{width:16px;height:16px;flex:none}svg{vertical-align:middle}button{display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn{padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;font-size:13px;line-height:1.5;white-space:nowrap}.btn:hover{background:var(--obsidian);border-color:var(--smoke)}.primary{background:var(--lime);color:var(--void);border-color:var(--lime);font-weight:510;padding:10px 16px;font-size:14px}.primary:hover{background:#edf77e;border-color:#edf77e}.plain{padding:8px 0;border:0;background:none;color:var(--fog);font-size:13px}.plain:hover{color:var(--white)}.muted{color:var(--fog)}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.pill{font-size:12px;line-height:20px;padding:3px 10px;border-radius:9999px;background:#ffffff0d;color:var(--mist);white-space:nowrap}.tag{padding:2px 6px;border-radius:4px;font-size:12px;background:#ffffff0d;color:var(--fog)}.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;margin-right:6px}.preview-bar{min-height:40px;padding:7px 20px;background:var(--carbon);border-bottom:1px solid var(--line);font-size:12px;display:flex;gap:16px;align-items:center;justify-content:space-between}.preview-bar .mode-label{display:flex;gap:8px;align-items:center}.preview-bar select{font-size:12px;background:transparent;border:0;max-width:150px}.preview-bar select option{background:var(--carbon)}.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 40px)}.sidebar{display:flex;flex-direction:column;padding:24px 16px 16px;border-right:.5px solid var(--line);background:var(--carbon)}.brand{padding:0 8px 25px;display:flex;align-items:center;gap:10px;color:var(--white);font-size:16px;font-weight:510}.brand svg{width:23px;height:23px}.workspace-name{display:flex;align-items:center;gap:10px;padding:12px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px}.avatar{height:30px;width:30px;background:var(--obsidian);border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:13px}.workspace-name p{font-size:13px;color:var(--white)}.workspace-name small{font-size:11px;color:var(--fog)}.nav-label{font-size:11px;color:var(--fog);padding:0 12px 12px;letter-spacing:.03em}.step{width:100%;display:flex;align-items:flex-start;justify-content:flex-start;gap:10px;padding:12px;border:0;border-radius:6px;background:transparent;color:var(--fog);text-align:left;margin-bottom:4px}.step.active{background:var(--obsidian);color:var(--white)}.step:hover{color:var(--white);background:var(--obsidian)}.stepnum{width:20px;height:20px;display:grid;place-items:center;flex:none;border:1px solid var(--smoke);border-radius:50%;font-size:10px;margin-top:2px}.step.done .stepnum{border:0;color:var(--mist)}.step.active .stepnum{border-color:var(--mist);color:var(--white)}.step strong{font-size:13px;font-weight:400;display:block}.step small{display:block;font-size:11px;color:var(--fog);margin-top:2px}.sidebar-bottom{margin-top:auto;padding:32px 8px 0}.sidebar-bottom button{width:100%;justify-content:flex-start}.save-note{margin-top:18px;font-size:11px;color:var(--fog)}.main{min-width:0}.topbar{height:64px;padding:0 32px;border-bottom:.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:13px}.breadcrumb{color:var(--fog);display:flex;gap:12px;align-items:center}.breadcrumb strong{color:var(--mist);font-weight:400}.content{padding:36px 32px 28px;max-width:1264px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:28px}.page-head .eyebrow{font-size:12px;color:var(--fog);margin-bottom:10px}.page-head p{margin-top:12px;font-size:14px;color:var(--fog)}.stage-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}.preview-frame{border:.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--carbon)}.frame-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;font-size:12px;gap:12px;border-bottom:1px solid var(--line)}.frame-head strong{font-weight:400}.scene{position:relative;aspect-ratio:16/9;isolation:isolate;overflow:hidden;background:var(--void)}.scene .background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scene .hero{position:absolute;height:35%;width:24%;object-fit:contain;left:38%;bottom:23%;filter:drop-shadow(0 4px 2px #0005)}.scene-label{position:absolute;bottom:12px;right:12px;background:#08090acc;padding:3px 8px;border-radius:4px;color:#d0d6e0;font-size:11px}.frame-foot{padding:12px 16px;font-size:12px;color:var(--fog);display:flex;justify-content:space-between;gap:12px}.below-preview{padding:20px 0;display:flex;gap:28px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.fact{font-size:13px}.fact span{color:var(--fog);font-size:12px;display:block;margin-bottom:4px}.result-notes{padding:20px 0 0}.result-notes h3{font-size:13px}.result-notes p{font-size:13px;margin-top:8px;color:var(--fog)}.review-side{padding:0 0 0 4px}.review-side h3{margin-bottom:12px}.review-side .intro{color:var(--fog);font-size:13px;margin-bottom:20px}.check-item{display:flex;gap:10px;padding:11px 0;border-bottom:.5px solid var(--line);font-size:13px}.check-item svg{width:15px;height:15px;margin-top:4px;flex:none}.check-item small{display:block;color:var(--fog);margin-top:4px}.approval{margin-top:24px}.approval .primary{width:100%;white-space:normal}.approval small{display:block;color:var(--fog);margin-top:10px;font-size:11px;line-height:1.7}.compose{margin-top:28px;padding-top:24px;border-top:.5px solid var(--line)}.compose label{display:block;font-size:13px;color:var(--mist);margin-bottom:10px}.compose textarea{width:100%;resize:vertical;min-height:102px;padding:12px 14px;border:1px solid #ffffff14;border-radius:6px;background:#ffffff05;font-size:14px;line-height:1.6}.compose textarea::placeholder{color:var(--fog)}.compose .row{margin-top:10px}.compose small{font-size:10px;color:var(--fog)}.compose select{max-width:100%;background:var(--carbon);border:1px solid var(--line);border-radius:6px;font-size:12px;padding:7px;margin-bottom:10px}.notice{border:1px solid var(--line);border-radius:6px;padding:14px 16px;font-size:13px;margin-bottom:24px;background:var(--carbon);display:flex;justify-content:space-between;gap:16px;align-items:center}.notice.error{border-color:#eb575744}.notice strong{font-weight:510;color:var(--white)}.notice p{color:var(--fog);font-size:12px;margin-top:4px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.candidate{padding:0;display:block;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--carbon);overflow:hidden;color:var(--mist)}.candidate.selected{border-color:var(--mist)}.candidate-visual{height:280px;background:var(--obsidian);display:grid;place-items:center}.candidate img{height:92%;width:100%;object-fit:contain}.candidate-info{padding:16px}.candidate-info .row{justify-content:space-between}.candidate-info p{margin-top:6px;font-size:12px;color:var(--fog)}.direction{padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--carbon)}.direction h2{font-size:24px;margin-top:12px}.direction p{font-size:16px;line-height:1.8;margin-top:16px}.direction dl{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:28px 0 0}.direction dt{font-size:12px;color:var(--fog)}.direction dd{font-size:15px;margin:6px 0 0}.keys{font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.keys kbd{font:12px ui-monospace,monospace;border:1px solid var(--smoke);border-radius:4px;padding:2px 5px;color:var(--mist)}.file-row{display:flex;align-items:center;gap:12px;padding:20px 0;border-bottom:1px solid var(--line)}.file-row svg{height:22px;width:22px}.file-row p{font-size:14px}.file-row small{color:var(--fog)}.delivery-box{padding:24px;border:1px solid var(--line);border-radius:12px}.delivery-box .file-row:last-child{border:0}.onboarding{padding:32px 0 56px;max-width:680px;margin:0 auto}.onboarding h1{font-size:48px;letter-spacing:-.022em;line-height:1.1}.onboarding>p{margin-top:20px;color:var(--fog);font-size:16px}.onboarding .direction{margin-top:32px}.onboarding textarea{width:100%;min-height:100px;background:none;border:0;resize:vertical;margin-top:20px;font-size:16px;outline:0}.onboarding .foot{margin-top:20px}.history-row{padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}.history-row strong{font-weight:510}.history-row p{font-size:12px;color:var(--fog);margin-top:5px}dialog{color:var(--mist);background:var(--carbon);border:1px solid var(--smoke);border-radius:12px;padding:24px;max-width:540px;width:calc(100% - 40px)}dialog::backdrop{background:#000a}dialog h2{font-size:20px}dialog p{font-size:14px;margin-top:12px;color:var(--fog)}dialog .actions{margin-top:24px;justify-content:flex-end}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:50;max-width:min(600px,90%);padding:12px 20px;border:1px solid var(--smoke);border-radius:6px;background:var(--obsidian);color:var(--mist);font-size:13px}#toast:empty{display:none}.mobile-project{display:none}
@media(min-width:1500px){.content{padding-top:48px}.stage-grid{grid-template-columns:minmax(0,1fr) 300px}}
@media(max-width:1120px){.shell{grid-template-columns:184px minmax(0,1fr)}.sidebar{padding-left:10px;padding-right:10px}.content{padding:28px 24px}.stage-grid{grid-template-columns:1fr}.review-side{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:0}.compose{margin-top:0;padding-top:0;border-top:0}.approval{margin-top:16px}.sidebar-bottom{padding-left:8px}.page-head p{max-width:480px}.candidate-visual{height:240px}}
@media(max-width:760px){.preview-bar{align-items:flex-start;gap:8px;flex-wrap:wrap;padding:8px 16px}.preview-bar .source{display:none}.shell{grid-template-columns:1fr}.sidebar{padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}.brand,.workspace-name,.nav-label,.sidebar-bottom{display:none}.steps{display:flex;overflow-x:auto;gap:4px}.step{min-width:88px;width:auto;flex:1;padding:10px 8px;margin:0;justify-content:center}.step small{display:none}.stepnum{display:none}.topbar{height:56px;padding:0 16px}.topbar .btn span{display:none}.content{padding:28px 16px}.page-head{align-items:flex-start}.page-head h1{font-size:24px}.page-head .eyebrow{margin-bottom:8px}.page-head p{font-size:13px}.page-head>.pill{display:none}.review-side{grid-template-columns:1fr;gap:24px}.compose{padding-top:24px;border-top:1px solid var(--line)}.candidate-visual{height:200px}.candidate-info{padding:12px}.candidate-info .pill{display:none}.direction{padding:20px}.direction dl{grid-template-columns:1fr}.onboarding{padding-top:16px}.onboarding h1{font-size:32px}.notice{align-items:flex-start;flex-wrap:wrap}.frame-foot{flex-wrap:wrap}.below-preview{gap:16px}.candidate-info p{font-size:11px}}
</style>

<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h7l2 3h9v12H3Z"/></symbol><symbol id="i-setting" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5ZM14 3v6h5M8 13h8M8 17h6"/></symbol><symbol id="i-send" viewBox="0 0 24 24"><path d="m4 11 16-7-7 16-2-7ZM11 13l9-9"/></symbol><symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8Zm-9 5 9 5 9-5M12 13v9M8 5l9 5"/></symbol></svg>
<div class="preview-bar"><div class="row"><span class="tag">3-0 设计预览</span><span class="muted">仅演示交互 · 不连接 AI</span></div><div class="row wrap"><label class="mode-label">预览状态 <select id="state" aria-label="预览状态"><option value="ready">待确认</option><option value="running">制作中</option><option value="failed">失败提示</option><option value="first">首次使用</option></select></label><a class="source" href="https://styles.refero.design/style/90ce5883-bb24-4466-93f7-801cd617b0d1" target="_blank" rel="noreferrer">Linear DESIGN.md ↗</a></div></div>
<div class="shell"><aside class="sidebar"><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="5"/><path d="M7 10h5M9.5 7.5v5M16 9h.01M18 12h.01"/></svg>AI 2D Studio</div><div class="workspace-name"><div class="avatar">竹</div><div><p>竹林剑客</p><small>我的第一个游戏</small></div></div><div class="nav-label">制作流程</div><nav id="steps" class="steps" aria-label="创作阶段"></nav><div class="sidebar-bottom"><button class="plain" data-history><svg fill="none" stroke="currentColor" stroke-width="1.5"><use href="#i-clock"/></svg>已保存版本</button><button class="plain" data-settings><svg fill="none" stroke="currentColor" stroke-width="1.5"><use href="#i-setting"/></svg>账户与环境</button><p class="save-note">你的创意，每一步都由你决定。</p></div></aside>
<main class="main"><header class="topbar"><div class="breadcrumb"><span>我的项目</span><span>/</span><strong>竹林剑客</strong></div><button class="btn" data-history><svg fill="none" stroke="currentColor" stroke-width="1.5"><use href="#i-clock"/></svg><span>版本记录</span></button></header><div id="content" class="content"></div></main></div>
<dialog id="dialog"><div class="row between"><h2 id="dialog-title"></h2><button class="plain" id="close-dialog" aria-label="关闭弹窗">关闭</button></div><div id="dialog-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
const names=['方向','人物','场景','核心试玩','完整游戏','交付'];
const titles=['先把你的想法，变成游戏方向。','选一个你想带进游戏的角色。','让你的角色，走进竹林。','先玩起来，再把玩法调对。','把一个想法，做成完整的一局。','把你确认的游戏，带走。'];
const descriptions=['AI 先整理怎么玩、长什么样。喜欢这个方向，再继续。','选择人物，再制作动作。确认过的形象会沿用到后面。','这一步先确认背景、视角和人物比例。玩法下一步再做。','沿用你确认的人物和场景，用一句话继续修改玩法。','三波战斗、局内升级和胜负结算，都放进同一个短局。','工程、网页游戏和打开说明，保存为同一份交付版本。'];
const confirms=['按这个方向生成人物','确认基础人物并保存','确认场景并开始试玩','确认核心试玩并保存','确认完整游戏并保存','我已验收，确认交付'];
const prompts=['例如：改成手动攻击，其他不变','例如：衣服改白，保留发型和武器','例如：竹林改成雪山，人物保持不变','例如：剑气碰墙反弹一次，其他不变','例如：减少每波敌人，其他保持不变',''];
let stage=2,selection='a',phase='candidates',saved=false;
const icon=(name)=>`<svg fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><use href="#i-${name}"/></svg>`;
function toast(message){document.getElementById('toast').textContent=message;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{document.getElementById('toast').textContent=''},5000)}
function dialog(title,body){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-content').innerHTML=body;document.getElementById('dialog').showModal()}
function scene(){return `<div class="preview-frame"><div class="frame-head"><strong>竹林剑客 <span class="muted">/ ${stage===2?'场景预览':'游戏画面'}</span></strong><span class="tag">沿用已确认人物</span></div><div class="scene"><img class="background" src="assets/scene.png" alt="已有竹林场景素材"><img class="hero" src="assets/character-${selection}.png" alt="已有主角素材"><span class="scene-label">静态设计示意 · 非试玩</span></div><div class="frame-foot">${stage>2?'<div class="keys"><kbd>WASD</kbd>移动 <kbd>J</kbd>攻击 <kbd>R</kbd>重来</div>':'<span>2D 俯视 · 单人小游戏</span>'}<span>人物与背景来自已有项目素材</span></div></div><div class="below-preview"><div class="fact"><span>主角</span>${selection==='a'?'青篁':'霜竹'} · 已选择</div><div class="fact"><span>画面</span>竹林 · 像素风格</div><div class="fact"><span>${stage>2?'本局目标':'当前范围'}</span>${stage>2?'击败三波敌人':'一张场景'}</div></div><div class="result-notes"><h3>这次${stage===2?'确认什么':'补充了什么'}</h3><p>${stage===2?'背景是否符合你的想法，角色在画面里是否清楚。':'在原人物和场景上完善玩法。完整游戏可继续修改难度和外观。'}</p></div>`}
function characters(){return `<div class="cards">${[['a','青篁','青衣剑客，轮廓轻巧利落。'],['b','霜竹','白衣剑客，红色发带点缀。']].map(([id,name,desc])=>`<button class="candidate ${selection===id?'selected':''}" data-character="${id}" aria-pressed="${selection===id}"><div class="candidate-visual"><img src="assets/character-${id}.png" alt="${name}候选人物"></div><div class="candidate-info"><div class="row"><h3>${name}</h3><span class="pill">${selection===id?'已选择':'点击选择'}</span></div><p>${desc}</p></div></button>`).join('')}</div><div class="result-notes"><h3>先选形象，再看动作</h3><p>选中后可以告诉 AI 修改哪里；确认基础人物后，再开始制作动作。</p></div>`}
function direction(){return `<div class="direction"><span class="tag">2D 俯视打怪</span><h2>竹林剑客</h2><p>在竹林中移动、挥剑，击退三波敌人。每波结束选一次升级，完成一小局武侠冒险。</p><dl><div><dt>怎么玩</dt><dd>方向键移动，按键挥剑</dd></div><div><dt>长什么样</dt><dd>像素风格 · 竹林 · 青衣剑客</dd></div><div><dt>游戏目标</dt><dd>击败三波敌人</dd></div><div><dt>这次做多少</dt><dd>一个主角，一张地图，一小局</dd></div></dl></div>`}
function delivery(){return `<div class="delivery-box"><h2>你的游戏，准备带走</h2><p class="muted" style="margin-top:8px;font-size:13px">示例交付内容 · 设计预览不会生成或下载文件</p>${[['file','Godot 可编辑工程','保留人物、场景和游戏逻辑'],['folder','网页游戏包','附带本机打开方法'],['box','完整压缩包与说明','方便保存，旧版保留']].map(([i,a,b])=>`<div class="file-row">${icon(i)}<div><p>${a}</p><small>${b}</small></div></div>`).join('')}<button class="btn" style="margin-top:20px" data-folder>${icon('folder')}打开交付文件夹</button></div>`}
function side(){const labels=stage===1?['选择基础人物','确认后再制作动作']:stage===2?['背景符合想法','人物清晰、比例合适']:stage===5?['打开工程与网页游戏','与最后确认版本一致']:['内容符合你的想法','可以继续提出修改'];return `<aside class="review-side"><div><h3>${stage===5?'交付前，最后确认':'看好这一版，再往下走'}</h3><p class="intro">${stage===1?'选择只决定人物形象，不代表动作已经完成。':stage===2?'这一步只决定画面，不会替你决定玩法。':'确认的成果会保存，之后仍然可以修改。'}</p>${labels.map(a=>`<div class="check-item">${icon('check')}<div>${a}</div></div>`).join('')}<div class="approval"><button class="btn primary" id="approve">${saved?(stage===1?'制作人物动作':stage===3?'开始制作完整游戏':stage===4?'导出工程与网页游戏':'已确认'):phase==='actions'&&stage===1?'确认人物动作并制作场景':confirms[stage]}${icon('arrow')}</button><small>${stage===5?'真实产品中，需你实际打开并验收后确认。':stage===2?'确认后开始制作核心试玩；当前场景会保存。':'当前为设计演示，点击不会启动真实制作。'}</small></div></div>${stage<5?`<form class="compose" id="modify"><label for="request">想改哪里，告诉 AI</label>${stage===4?'<select aria-label="修改目标"><option>玩法与难度</option><option>只改人物外观，保留玩法</option><option>只改背景，保留玩法</option></select>':''}<textarea id="request" placeholder="${prompts[stage]}" maxlength="1000"></textarea><div class="row between"><small>Enter 发送 · Shift + Enter 换行</small><button class="btn" type="submit">${icon('send')}发送</button></div></form>`:`<div class="compose"><h3>还想调整？</h3><p class="intro" style="margin-top:10px">回到完整游戏继续修改，原来的交付版本会保留。</p><button class="btn" data-back>返回完整游戏</button></div>`}</aside>`}
function render(){const mode=document.getElementById('state').value;document.getElementById('steps').innerHTML=names.map((name,i)=>`<button class="step ${stage===i?'active':i<stage?'done':''}" data-stage="${i}" ${stage===i?'aria-current="step"':''}><span class="stepnum">${i<stage?'✓':String(i+1).padStart(2,'0')}</span><span><strong>${name}</strong><small>${stage===i?(saved?'已确认':mode==='running'?'制作中':mode==='failed'?'需处理':'当前步骤'):i<stage?'已确认':'后续步骤'}</small></span></button>`).join('');
 if(mode==='first'){document.getElementById('content').innerHTML=`<div class="onboarding"><span class="tag">开始你的第一个游戏</span><h1 style="margin-top:24px">从一个想法，<br>到你的第一个游戏。</h1><p>描述你想做什么。AI 分步制作，每一步都让你看过再继续。</p><div class="direction"><h3>我想做一个……</h3><textarea aria-label="游戏想法">武侠类的俯视打怪游戏，主角是青衣剑客，在竹林里战斗。</textarea></div><div class="notice" style="margin-top:24px"><div><strong>先连接你的 AI 账户</strong><p>用已有账号登录，回来后继续。写好的想法会保留。</p></div><button class="btn primary" data-settings>去登录 ${icon('arrow')}</button></div><p class="muted" style="font-size:12px">支持 2D 横版闯关和俯视打怪，题材不限。</p></div>`;bind();return}
 const banner=mode==='running'?`<div class="notice"><div><strong>${stage===5?'正在准备交付包':'正在制作'+names[stage]}</strong><p>完成后会停下来，等你确认。${stage===5?'导出不会调用 AI。':'上一版成果仍保留。'}</p></div><button class="btn" data-stop>停止制作</button></div>`:mode==='failed'?`<div class="notice error" role="alert"><div><strong>这次${names[stage]}修改没有完成</strong><p>上一版仍保留。你可以重试，或回到已保存版本。</p></div><button class="btn" data-retry>重试这一步</button></div>`:'';
 document.getElementById('content').innerHTML=`<div class="page-head"><div><div class="eyebrow">第 ${String(stage+1).padStart(2,'0')} 步 / 共 06 步 · ${phase==='actions'&&stage===1?'人物动作':names[stage]}</div><h1>${titles[stage]}</h1><p>${descriptions[stage]}</p></div><span class="pill"><span class="dot"></span>${saved?'已确认':mode==='running'?'制作中':mode==='failed'?'需处理':'待你确认'}</span></div>${banner}<div class="stage-grid"><section>${stage===0?direction():stage===1?characters():stage===5?delivery():scene()}</section>${side()}</div>`;
 if(mode==='running'||mode==='failed'){document.getElementById('approve').disabled=true;const form=document.getElementById('modify');if(form)form.querySelectorAll('textarea,button,select').forEach(x=>x.disabled=true)}bind();}
function go(i){stage=i;saved=false;phase='candidates';document.getElementById('state').value='ready';render()}
function bind(){document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>go(Number(b.dataset.stage)));document.querySelectorAll('[data-character]').forEach(b=>b.onclick=()=>{selection=b.dataset.character;saved=false;render()});document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>dialog('已保存版本',`<p>下面是版本列表的设计示例。恢复会切换整套成果，不会只换一张图。</p>${['当前场景草稿','已确认人物动作','已确认人物形象'].map((s,i)=>`<div class="history-row"><div><strong>${s}</strong><p>${i===0?'当前展示版本':'人物、场景与确认记录一起保留'}</p></div><button class="btn" data-restore="${s}">查看影响</button></div>`).join('')}`));document.querySelectorAll('[data-settings]').forEach(b=>b.onclick=()=>dialog('连接 AI，开始制作','<p>正式产品会在这里显示登录入口、连接状态和环境引导。</p><p>这是设计预览，不会打开登录、安装软件或读取账户。</p><div class="actions row"><button class="btn" data-close>知道了</button></div>'));document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{document.getElementById('state').value='running';render();toast('正在展示“制作中”设计状态，没有启动真实任务。')});document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>{document.getElementById('state').value='ready';render();toast('设计演示已停止，仍展示上一版素材。')});document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>toast('设计预览：正式产品会打开这份交付包的文件夹。'));document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>go(4));const approve=document.getElementById('approve');if(approve)approve.onclick=()=>{if(stage===1&&!saved&&phase==='candidates'){saved=true;render();toast('形象已选定（演示）。下一步由你开始制作动作。')}else if(stage===1&&saved){saved=false;phase='actions';render();toast('这是动作确认界面的布局示意，未生成或播放新动作。')}else if(stage===0||stage===2||(stage===1&&phase==='actions')){go(stage+1);toast('已切换到下一步的设计示意，未调用 AI。')}else if(saved&&stage<5){go(stage+1)}else{saved=true;render();toast('确认状态仅用于预览，不会写入真实项目。')}};const form=document.getElementById('modify');if(form){form.onsubmit=e=>{e.preventDefault();if(document.getElementById('request').value.trim())dialog('修改前，先看影响','<p>这条要求将作用于当前成果。已有版本会保留，完成后需要你重新确认。</p><p>当前为交互示意，不会发送给 AI。</p><div class="actions row"><button class="btn" data-close>返回编辑</button><button class="btn primary" data-demo-send>确认影响，继续</button></div>')};document.getElementById('request').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!e.repeat)form.requestSubmit()}}}}
document.getElementById('state').onchange=()=>{saved=false;render()};document.getElementById('close-dialog').onclick=()=>document.getElementById('dialog').close();document.getElementById('dialog').addEventListener('click',e=>{if(e.target.closest('[data-close]'))document.getElementById('dialog').close();if(e.target.closest('[data-demo-send]')){document.getElementById('dialog').close();toast('修改流程演示结束；没有调用 AI，也没有改动文件。')}const restore=e.target.closest('[data-restore]');if(restore){document.getElementById('dialog-content').innerHTML='<p>会恢复所选版本的人物、场景、玩法和确认记录。较新的版本仍保留。</p><p>设计演示不会恢复或覆盖你的真实项目。</p><div class="actions row"><button class="btn" data-close>返回</button><button class="btn primary" data-demo-send>确认恢复整套版本</button></div>'}});render();
</script>
</body></html>
